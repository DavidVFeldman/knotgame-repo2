name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and audit axioms
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # Resume across runs: cache the project's own build products keyed on
      # the sources, so a killed run continues instead of restarting.
      # Add swap: the heaviest kernel reductions exceed even 16 GB of RAM.
      # The runner already has an active /swapfile, so write a second one at a
      # different path. Non-fatal: swap is insurance, not a requirement, and a
      # runner that refuses it should still attempt the build.
      # ADD swap; never `swapoff -a` first -- an earlier version did, and when
      # the allocation then failed the job ran with LESS headroom than default.
      - name: Add swap
        continue-on-error: true
        run: |
          set -x
          df -h /mnt /
          sudo fallocate -l 16G /mnt/extraswap || sudo dd if=/dev/zero of=/mnt/extraswap bs=1M count=16384
          sudo chmod 600 /mnt/extraswap
          sudo mkswap /mnt/extraswap
          sudo swapon /mnt/extraswap
          swapon --show
          free -h

      # RESTORE and SAVE are separate, and the save runs even when the build
      # fails: actions/cache (combined) only saves on success, so every failed
      # run used to discard all the modules it had built. With this, progress
      # is cumulative across runs and a killed run resumes where it stopped.
      - name: Restore project build
        id: lakecache
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib build cache
        run: lake exe cache get

      # `lake build` elaborates RequestProject.AxiomAudit, which calls
      # Lean.collectAxioms on every public theorem of the KnotGame namespace and
      # throws if any axiom outside {propext, Classical.choice, Quot.sound}
      # occurs (in particular sorryAx). The audit is semantic: it inspects the
      # elaborated environment, never the text of the sources.
      # The certificate modules are memory-heavy; this Lake version has no
      # jobs flag, so serialization is done by construction: one module per
      # invocation, in topological order of the import graph, so each call
      # compiles at most one new module and peak memory is a single module.
      # Every completed module is banked by the cache step above. The final
      # bare build covers All, AxiomAudit (the semantic axiom audit) and Main.
      - name: Build (serial; includes the semantic axiom audit)
        run: |
          set -e
          for m in Basic Branching BranchingContinuum BranchingCount Distinct ExpCount ExpCert ExpLower ExpMulti ExpMultiCert ExpSharpData ExpSharp ExpSharperData ExpSharper ExpVar ExpAboveData0 ExpAboveData1 ExpAboveData10 ExpAboveData11 ExpAboveData2 ExpAboveData3 ExpAboveData4 ExpAboveData5 ExpAboveData6 ExpAboveData7 ExpAboveData8 ExpAboveData9 ExpAboveData ExpAboveChecks ExpAbove ExpWindowData ExpWindow Lucas FourierFloor FourierGeneral FourierReflect FourierEnclosure ReturnTail RunRational Suffix Littlewood Immortal Threshold Golden Pisot Gaps CircleForm Deficit GoldenEffective Plastic Overlap PlasticFourier PlasticOrbit PlasticIndex PlasticTbl PlasticCert RecordLower Sqrt2 Supergolden SupergoldenFourier SurvivorSet Backward Candidates CandidateInstance Permanence Compactness Density DensityQuant PeriodicYield Ternary KindTree KindDim KindDimLower Mahler NoRecurrence Square Translation ImmortalMahler TransversalityBounds TransversalityChecker TransversalityCertificate TransversalitySound TransversalityCell Transversality CommonWindow PairCounting Tribonacci TribonacciFourier TwoStep RecordDepths PisotDecide RecordGaps WindowSharp KindBox CountingOperator Trapezoid BranchBridge BackwardClosure Contraction EquiMean InvariantMeasure; do
            lake build RequestProject.$m
          done
          lake build

      - name: Machine state after build
        if: always()
        run: |
          free -h; swapon --show; df -h /mnt /
          dmesg 2>/dev/null | tail -30 | grep -i -E "oom|killed process" || echo "no OOM lines visible in dmesg"

      - name: Save project build (even if the build failed)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      # A belt-and-braces textual check. The audit above is what actually
      # guarantees soundness; this only catches a `sorry` in a declaration that
      # the audit does not reach (e.g. a `def`).
      - name: Textual check for sorry / admit / axiom / native_decide
        run: |
          # Strip line comments before searching, so that prose mentioning a
          # forbidden token (e.g. a comment explaining why a file was removed)
          # cannot fail the check, while code containing one still does.
          hits=0
          for f in $(find RequestProject -name '*.lean'); do
            if sed -e 's/--.*$//' "$f" | grep -nE '(^|[ \t;(\[])(sorry|admit|native_decide)\b|^axiom ' > /tmp/hits.txt ; then
              echo "=== $f"; cat /tmp/hits.txt; hits=1
            fi
          done
          if [ "$hits" = 1 ]; then
            echo "::error::forbidden token found"; exit 1
          fi
