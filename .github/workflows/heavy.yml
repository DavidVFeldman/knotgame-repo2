name: Heavy modules (manual)

# The two quarantined groups: the 25,525-state plastic closure and the
# multiplicity-49 certificate. Both exceed the memory of the standard runner.
# Run this manually (Actions -> Heavy modules -> Run workflow); it restores the
# main build cache, adds a large swap file, and banks whatever it manages,
# so repeated runs make cumulative progress.

on:
  workflow_dispatch:

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The runner already has an active /swapfile, so write a second one at a
      # different path. Non-fatal: swap is insurance, not a requirement, and a
      # runner that refuses it should still attempt the build.
      # ADD swap; never `swapoff -a` first -- an earlier version did, and when
      # the allocation then failed the job ran with LESS headroom than default.
      - name: Add swap
        continue-on-error: true
        run: |
          set -x
          df -h /mnt /
          sudo fallocate -l 32G /mnt/extraswap || sudo dd if=/dev/zero of=/mnt/extraswap bs=1M count=32768
          sudo chmod 600 /mnt/extraswap
          sudo mkswap /mnt/extraswap
          sudo swapon /mnt/extraswap
          swapon --show
          free -h

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-mathlib-cache: true

      - name: Restore project build
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: heavy-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            heavy-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # The quarantined modules are not in the working tree; restore them from
      # the commit that removed them before attempting a build.
      - name: Restore quarantined modules from history
        run: |
          set -e
          c=$(git log --diff-filter=D --format=%H -1 -- 'quarantine/KindBox.lean' || true)
          if [ -n "$c" ]; then
            git checkout "$c^" -- quarantine || true
            # KindBox.lean was repaired in round 13 and lives in the working
            # tree; never overwrite it with the old, unbuildable quarantined
            # copy.
            rm -f quarantine/KindBox.lean
            cp quarantine/*.lean RequestProject/ || true
          fi
          ls RequestProject/ | grep -E "KindBox|PlasticConfig|ExpSharpest" || \
            { echo "quarantined modules not found in history; nothing to do"; exit 0; }

      - name: Build quarantined modules, one at a time
        run: |
          set -e
          for m in PlasticConfig PlasticOrbitCount ExpSharpestData0 ExpSharpestData1 \
                   ExpSharpestData2 ExpSharpestData3 ExpSharpestData4 ExpSharpestData5 \
                   ExpSharpestData6 ExpSharpestData7 ExpSharpestData8 ExpSharpestData \
                   ExpSharpestChecks0 ExpSharpestChecks1 ExpSharpestChecks2 \
                   ExpSharpestChecks3 ExpSharpestChecks4 ExpSharpestChecks5 \
                   ExpSharpestChecks6 ExpSharpestChecks7 ExpSharpestChecks8 ExpSharpest; do
            echo "=== $m"
            lake build RequestProject.$m
          done

      - name: Save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: heavy-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
